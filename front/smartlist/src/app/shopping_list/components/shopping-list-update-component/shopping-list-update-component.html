<div class="container">
  <h2>Atualizar Lista de Compras</h2>
  <form (ngSubmit)="updateShoppingList(id)">
    <div class="form-group">

      <label for="id">ID da lista:</label>
<input
  type="text"
  id="id"
  name="id"
  [(ngModel)]="id"
  placeholder="Digite o ID da lista"
  required
/>

      <label for="name"> Nome da lista: </label>
      <input type="text"
      id="name"
      name="name"
      [(ngModel)]="shoppingList.name"
      placeholder="Digite o nome da lista"
      required>

      <label for="description"> Descrição da lista: </label>
      <input type="text"
      id="description"
      name="description"
      [(ngModel)]="shoppingList.description"
      placeholder="Digite a descrição da lista"
      required>

      <label for="creationDate"> Data de criação: </label>
      <input type="date"
      id="creationDate"
      name="creationDate"
      [(ngModel)]="shoppingList.creationDate"
      placeholder="Digite a data de criação"
      required>
    </div>

    <button type="submit">Atualizar Lista</button>
  </form>
